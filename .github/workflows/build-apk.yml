name: Build FIZI APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build debug APK
        run: |
          if [ ! -f package.json ]; then unzip -q fizi-ai.zip; cd fizi-ai; fi
          npm install
          npm run build
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-feature android:name="android.hardware.camera" android:required="false"/><application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out" && cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/FIZI-AI.apk"
      - uses: actions/upload-artifact@v4
        with: { name: FIZI-AI-apk, path: out/FIZI-AI.apk }
